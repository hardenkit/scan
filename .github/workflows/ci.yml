name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - run: make build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the container image and run it
        run: |
          docker build --build-arg VERSION=ci -t hardenkit-scan:ci .
          docker run --rm hardenkit-scan:ci version
          docker run --rm -v "$PWD/testdata:/src:ro" hardenkit-scan:ci scan --no-nvd /src
