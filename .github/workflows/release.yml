name: Release

# Builds hardenkit for every supported platform when a version tag is pushed
# (e.g. v0.1.0) and publishes the archives plus a checksums file to a GitHub
# release. Tags with a hyphen (v0.1.0-alpha.1) are marked as pre-releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="hardenkit_${version}_${GOOS}_${GOARCH}"
          bin=hardenkit; [ "$GOOS" = windows ] && bin=hardenkit.exe
          mkdir -p "build/$name" dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "build/$name/$bin" ./cmd/hardenkit
          cp LICENSE README.md "build/$name/"
          if [ "$GOOS" = windows ]; then
            (cd build && zip -qr "../dist/$name.zip" "$name")
          else
            tar -C build -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        run: |
          cd dist
          sha256sum * > checksums.txt
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags *
