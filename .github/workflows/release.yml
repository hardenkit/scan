name: Release

# Builds hardenkit for every supported platform when a version tag is pushed
# (e.g. v0.1.0) and publishes the archives plus a checksums file to a GitHub
# release. Tags with a hyphen (v0.1.0-alpha.1) are marked as pre-releases.
# It also pushes the container image ghcr.io/hardenkit/scan for linux/amd64
# and linux/arm64, tagged with the version and, for full releases, "latest".

on:
  push:
    # Version tags only. The moving major tag the action is used by (v0) has no dots.
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="hardenkit_${version}_${GOOS}_${GOARCH}"
          bin=hardenkit; [ "$GOOS" = windows ] && bin=hardenkit.exe
          mkdir -p "build/$name" dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "build/$name/$bin" ./cmd/hardenkit
          cp LICENSE README.md "build/$name/"
          if [ "$GOOS" = windows ]; then
            (cd build && zip -qr "../dist/$name.zip" "$name")
          else
            tar -C build -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        run: |
          cd dist
          sha256sum * > checksums.txt
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags *

  image:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="-t ghcr.io/hardenkit/scan:$version"
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags -t ghcr.io/hardenkit/scan:latest";; esac
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --label "org.opencontainers.image.source=https://github.com/hardenkit/scan" \
            --label "org.opencontainers.image.description=Open-source vulnerability scanner that ranks findings by real attacks" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            $tags --push .
