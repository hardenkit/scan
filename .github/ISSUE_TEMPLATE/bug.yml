name: Bug
description: Something in hardenkit does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command's output. Remove anything private first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `hardenkit version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 26, ...
