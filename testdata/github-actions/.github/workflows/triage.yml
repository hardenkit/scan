name: Triage
on:
  issue_comment:
    types: [created]
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const command = "${{ github.event.comment.body }}".trim()
            if (command === "/bug") {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ["bug"] })
            }
